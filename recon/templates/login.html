{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block header %}{% endblock %}
{% block body %}
<div style="max-width:380px;margin:12vh auto 0">
  <h1>Kredo · Reconciliation</h1>
  <p class="sub">Enter the team password to continue.</p>
  <form method="post" action="/login" class="card">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="small muted" for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required
           style="width:100%;font:inherit;padding:9px;margin:6px 0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
    {% if error %}<p class="small" style="color:var(--gap);margin:0 0 10px" role="alert">{{ error }}</p>{% endif %}
    <button class="btn" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
