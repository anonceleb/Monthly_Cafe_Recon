# Render Blueprint: one private web service + one Postgres that only the web service can reach.
# Render dashboard → New → Blueprint → pick this repo. You will be asked for RECON_PASSWORD once.
databases:
  - name: kredo-recon-db
    plan: basic-256mb
    region: singapore
    databaseName: kredo_recon
    ipAllowList: []            # no access from the internet; only services in the same Render region/account

services:
  - type: web
    name: kredo-recon
    runtime: docker
    plan: starter
    region: singapore          # keep in the same region as the database
    healthCheckPath: /healthz
    autoDeploy: true           # redeploys on every push to main; set false to deploy manually
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kredo-recon-db
          property: connectionString
      - key: RECON_PASSWORD
        sync: false            # you type it in the dashboard; it is never stored in git
      - key: RECON_SECRET
        generateValue: true    # signs session cookies
