[project]
name = "recon-v2"
version = "0.1.0"
description = "Small, rule-based reconciliation: Petpooja vs Zomato/Swiggy payouts vs ICICI bank statement"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon"]
